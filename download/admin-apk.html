<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ADMIN">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f59e0b">
<title>ADMIN — Apna Cricket</title>
<link rel="manifest" href="https://fantasypro-olive.vercel.app/admin/admin-manifest.json">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0f0f1a; color:#f59e0b; font-family:system-ui,sans-serif; overflow:hidden; }
#loader {
  position:fixed; inset:0; display:flex; flex-direction:column;
  align-items:center; justify-content:center; z-index:9999;
  background:linear-gradient(135deg,#1a1a2e,#16213e);
}
#loader h1 { font-size:2em; margin-bottom:20px; letter-spacing:3px; }
#loader .spin {
  width:60px; height:60px; border:4px solid rgba(245,158,11,0.2);
  border-top:4px solid #f59e0b; border-radius:50%;
  animation:spin 1s linear infinite;
}
@keyframes spin { 100%{ transform:rotate(360deg) } }
#loader p { margin-top:15px; font-size:0.9em; opacity:0.7; }
#frame { position:fixed; inset:0; width:100%; height:100%; border:0; }
</style>
</head>
<body>
<div id="loader">
  <h1>⚡ ADMIN</h1>
  <div class="spin"></div>
  <p>Loading Admin Panel...</p>
</div>
<script>
// Redirect to admin panel
window.location.replace("https://fantasypro-olive.vercel.app/admin");
</script>
</body>
</html>
