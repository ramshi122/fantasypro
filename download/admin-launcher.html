<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>ADMIN — Apna Cricket</title>
    <meta name="theme-color" content="#f59e0b">
    <link rel="manifest" href="/admin-manifest.json">
    <style>
        body { margin: 0; padding: 0; overflow: hidden; }
        iframe { width: 100vw; height: 100vh; border: none; }
        .loading {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-family: sans-serif; text-align: center; color: #f59e0b;
        }
        .spinner {
            border: 4px solid #f3f3f3; border-top: 4px solid #f59e0b;
            border-radius: 50%; width: 50px; height: 50px;
            animation: spin 1s linear infinite; margin: 20px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="loading">
        <h2>ADMIN</h2>
        <div class="spinner"></div>
        <p>Loading Admin Panel...</p>
    </div>
    <iframe src="https://apna-cricket.vercel.app/admin" onload="document.querySelector('.loading').style.display='none'"></iframe>
    <script>
        // Redirect to admin page directly
        window.location.href = "https://apna-cricket.vercel.app/admin";
    </script>
</body>
</html>
